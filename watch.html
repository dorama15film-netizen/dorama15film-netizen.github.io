<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смотреть дораму</title>
    <link rel="icon" href="Log.png" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0b0e14;
            --bg-secondary: #151b24;
            --bg-card: #151b24;
            --bg-header: #0f141c;
            --text-primary: #f0f2f5;
            --text-secondary: #8892a8;
            --text-muted: #6a7288;
            --border-color: #1f2631;
            --border-light: #2a313f;
            --shadow: rgba(0, 0, 0, 0.5);
            --shadow-glow: rgba(241, 196, 15, 0.15);
            --input-bg: #000000;
            --toast-bg: #151b24;
            --modal-bg: #151b24;
            --scrollbar-track: #1a212b;
            --scrollbar-thumb: #f1c40f;
            --accent-color: #f1c40f;
            --accent-hover: #f39c12;
        }

        [data-theme="light"] {
            --bg-primary: #e8f4f8;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-header: #d4ecf5;
            --text-primary: #1a2a3a;
            --text-secondary: #3a5a6a;
            --text-muted: #5a7a8a;
            --border-color: #b0d4e0;
            --border-light: #90c4d4;
            --shadow: rgba(0, 180, 200, 0.15);
            --shadow-glow: rgba(0, 212, 255, 0.25);
            --input-bg: #f0f8fa;
            --toast-bg: #ffffff;
            --modal-bg: #ffffff;
            --scrollbar-track: #d4ecf5;
            --scrollbar-thumb: #00bcd4;
            --accent-color: #00bcd4;
            --accent-hover: #0097a7;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .header {
            padding: 16px 30px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .header .back-btn {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            padding: 10px 24px;
            background: #1a4d2e;
            border: 2px solid var(--accent-color);
            border-radius: 30px;
            transition: 0.3s ease;
            display: inline-block;
        }

        .header .back-btn:hover {
            background: #2a6d3e;
            border-color: var(--accent-hover);
            transform: scale(1.02);
            box-shadow: 0 0 30px var(--shadow-glow);
        }

        .header .title {
            font-size: 22px;
            font-weight: 700;
            color: #1a4d2e;
            text-shadow:
                0 0 10px rgba(241, 196, 15, 0.5),
                0 0 20px rgba(241, 196, 15, 0.3),
                0 0 40px rgba(241, 196, 15, 0.1);
            -webkit-text-stroke: 1px var(--accent-color);
            text-stroke: 1px var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: text-shadow 0.3s ease, -webkit-text-stroke 0.3s ease;
        }

        .header .title span {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 16px;
            margin-left: 10px;
            transition: color 0.3s ease;
        }

        .theme-toggle-wrapper {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle-label {
            color: var(--text-secondary);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .theme-switch {
            position: relative;
            width: 56px;
            height: 30px;
            background: #2a313f;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s ease;
            border: 2px solid #3a4555;
            flex-shrink: 0;
        }

        [data-theme="light"] .theme-switch {
            background: #00bcd4;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .theme-switch .slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 22px;
            height: 22px;
            background: #8892a8;
            border-radius: 50%;
            transition: 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        [data-theme="light"] .theme-switch .slider {
            left: 28px;
            background: #ffffff;
            box-shadow: 0 2px 12px rgba(0, 212, 255, 0.4);
        }

        .theme-switch:hover {
            border-color: var(--accent-color);
            transform: scale(1.05);
        }

        .theme-switch .theme-icons {
            display: flex;
            justify-content: space-between;
            padding: 0 6px;
            align-items: center;
            height: 100%;
            font-size: 14px;
            color: #6a7288;
            pointer-events: none;
        }

        [data-theme="light"] .theme-icons .sun-icon { color: #ffffff; }
        [data-theme="dark"] .theme-icons .moon-icon { color: #f1c40f; }

        .main-content {
            flex: 1;
            padding: 20px 30px 30px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .player-wrapper {
            width: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
            aspect-ratio: 16 / 9;
            transition: border-color 0.3s ease;
        }

        .player-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .episode-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .episode-info .current-episode {
            font-size: 20px;
            font-weight: 600;
            color: var(--accent-color);
            transition: color 0.3s ease;
        }

        .episode-info .episode-title {
            color: var(--text-secondary);
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .episodes-list {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding: 10px 0 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }

        .episodes-list .episode-btn {
            background: var(--bg-secondary);
            border: 2px solid var(--border-light);
            color: var(--text-secondary);
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: 0.25s ease;
        }

        .episodes-list .episode-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        .episodes-list .episode-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #0b0e14;
        }

        .drama-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 10px;
        }

        .drama-description {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.8;
            transition: color 0.3s ease;
        }

        .drama-description .info-item {
            display: flex;
            gap: 10px;
            margin-bottom: 6px;
        }

        .drama-description .info-item .label {
            color: var(--text-muted);
            min-width: 120px;
            flex-shrink: 0;
            transition: color 0.3s ease;
        }

        .drama-description .info-item .value {
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .drama-description .plot {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.8;
            margin-top: 8px;
            transition: color 0.3s ease;
        }

        .drama-description .plot strong {
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .cast-section .cast-title {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            transition: color 0.3s ease;
        }

        .cast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .cast-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .cast-item .actor-name {
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .cast-item .actor-role {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 2px;
            transition: color 0.3s ease;
        }

        .cast-item .actor-role-tag {
            background: #1e232c;
            color: var(--accent-color);
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 4px;
            transition: color 0.3s ease;
        }

        .comments-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            width: 100%;
            transition: border-color 0.3s ease;
        }

        .comments-section .comments-title {
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color 0.3s ease;
        }

        .comments-section .comments-title span {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        .comment-form {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .comment-form input {
            flex: 1;
            min-width: 200px;
            padding: 12px 18px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-light);
            border-radius: 30px;
            color: var(--text-primary);
            font-family: system-ui, sans-serif;
            font-size: 14px;
            outline: none;
            transition: 0.3s ease;
        }

        .comment-form input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 30px var(--shadow-glow);
        }

        .comment-form input::placeholder {
            color: var(--text-muted);
        }

        .comment-form textarea {
            flex: 2;
            min-width: 300px;
            padding: 12px 18px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-light);
            border-radius: 16px;
            color: var(--text-primary);
            font-family: system-ui, sans-serif;
            font-size: 14px;
            outline: none;
            resize: vertical;
            min-height: 60px;
            transition: 0.3s ease;
        }

        .comment-form textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 30px var(--shadow-glow);
        }

        .comment-form .submit-btn {
            background: #1a4d2e;
            border: 2px solid var(--accent-color);
            border-radius: 30px;
            color: var(--text-primary);
            padding: 12px 28px;
            font-family: system-ui, sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            white-space: nowrap;
        }

        .comment-form .submit-btn:hover {
            background: #2a6d3e;
            border-color: var(--accent-hover);
            transform: scale(1.02);
            box-shadow: 0 0 30px var(--shadow-glow);
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .comments-list::-webkit-scrollbar {
            width: 4px;
        }
        .comments-list::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 10px;
        }
        .comments-list::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 10px;
        }

        .comment-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 18px;
            animation: fadeInUp 0.3s ease;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .comment-item .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .comment-item .comment-author {
            color: var(--accent-color);
            font-weight: 600;
            font-size: 15px;
            transition: color 0.3s ease;
        }

        .comment-item .comment-date {
            color: var(--text-muted);
            font-size: 12px;
            transition: color 0.3s ease;
        }

        .comment-item .comment-text {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            transition: color 0.3s ease;
        }

        .comment-item .comment-delete {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s ease;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .comment-item .comment-delete:hover {
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
        }

        .no-comments {
            color: var(--text-muted);
            text-align: center;
            padding: 20px;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .toast-container {
            position: fixed;
            bottom: 100px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 350px;
        }

        .toast {
            background: var(--toast-bg);
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            padding: 14px 20px;
            color: var(--text-primary);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 14px;
            box-shadow: 0 8px 30px var(--shadow);
            animation: slideInRight 0.4s ease, fadeOut 0.4s ease 2.6s forwards;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        .toast.success {
            border-color: #2ecc71;
        }

        .toast.error {
            border-color: #e74c3c;
        }

        .toast.info {
            border-color: var(--accent-color);
        }

        .toast .toast-icon {
            font-size: 20px;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(50px); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .header { padding: 12px 16px; }
            .header .title { font-size: 18px; }
            .theme-toggle-wrapper { gap: 6px; }
            .theme-switch { width: 48px; height: 26px; }
            .theme-switch .slider { width: 18px; height: 18px; }
            [data-theme="light"] .theme-switch .slider { left: 24px; }
            .theme-toggle-label { font-size: 11px; }
            .main-content { padding: 12px 16px 20px; }
            .drama-info { grid-template-columns: 1fr; gap: 20px; }
            .cast-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .drama-description .info-item .label { min-width: 90px; }
            .comment-form { flex-direction: column; }
            .comment-form input { min-width: auto; }
            .comment-form textarea { min-width: auto; min-height: 50px; }
        }

        @media (max-width: 480px) {
            .header .title { font-size: 15px; }
            .header .title span { font-size: 13px; display: block; margin-left: 0; }
            .theme-toggle-wrapper { gap: 4px; }
            .theme-switch { width: 42px; height: 22px; }
            .theme-switch .slider { width: 16px; height: 16px; top: 1px; left: 1px; }
            [data-theme="light"] .theme-switch .slider { left: 22px; }
            .theme-toggle-label { font-size: 10px; }
            .theme-switch .theme-icons { font-size: 11px; padding: 0 4px; }
            .cast-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .cast-item { padding: 10px 12px; }
            .drama-description .info-item { flex-direction: column; gap: 2px; }
            .drama-description .info-item .label { min-width: auto; }
            .drama-description .plot { font-size: 13px; }
            .comments-section .comments-title { font-size: 17px; }
            .comment-item .comment-author { font-size: 13px; }
            .comment-item .comment-text { font-size: 13px; }
            .toast-container { bottom: 70px; right: 10px; max-width: 240px; }
            .toast { font-size: 12px; padding: 10px 14px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="back-btn"> На главную</a>
        <div class="title"> <span id="dramaTitle">Завтра снова на работу!</span> <span id="dramaEpisodes">6 серий</span></div>

        <div class="theme-toggle-wrapper">
            <span class="theme-toggle-label" id="themeLabel">Тема</span>
            <div class="theme-switch" id="themeSwitch">
                <div class="slider"></div>
                <div class="theme-icons">
                    <span class="moon-icon">🌙</span>
                    <span class="sun-icon">☀️</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="player-wrapper">
            <iframe id="videoPlayer" src="" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; screen-wake-lock;" frameborder="0" allowfullscreen></iframe>
        </div>

        <div class="episode-info">
            <div>
                <span class="current-episode" id="currentEpisode">Серия 1</span>
                <span class="episode-title" id="episodeTitle"> Начало истории</span>
            </div>
        </div>

        <div class="episodes-list" id="episodesList"></div>

        <div class="drama-info" id="dramaInfo"></div>

        <div class="comments-section" id="commentsSection">
            <div class="comments-title">
                 Комментарии <span id="commentsCount">(0)</span>
            </div>

            <div class="comment-form">
                <input type="text" id="commentName" placeholder="Ваше имя..." maxlength="30" />
                <textarea id="commentText" placeholder="Напишите комментарий..." maxlength="500"></textarea>
                <button class="submit-btn" id="submitComment">Отправить</button>
            </div>

            <div class="comments-list" id="commentsList">
                <div class="no-comments">Пока нет комментариев. Будьте первым! </div>
            </div>
        </div>
    </main>

    <script>
        // =====================================================
        // ===== ТЕМА =====
        // =====================================================
        const themeSwitch = document.getElementById('themeSwitch');
        let currentTheme = localStorage.getItem('theme') || 'dark';

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            currentTheme = theme;
        }

        themeSwitch.addEventListener('click', () => {
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
            showToast(newTheme === 'light' ? '☀️ Светлая тема' : '🌙 Тёмная тема', '', 'info');
        });

        applyTheme(currentTheme);

        // =====================================================
        // ===== TOAST =====
        // =====================================================
        function showToast(message, icon = '', type = 'info') {
            const container = document.getElementById('toastContainer') || createToastContainer();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span class="toast-icon">${icon}</span> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 3000);
        }

        function createToastContainer() {
            const container = document.createElement('div');
            container.className = 'toast-container';
            container.id = 'toastContainer';
            document.body.appendChild(container);
            return container;
        }

        // =====================================================
        // ===== ДАННЫЕ О ДОРАМАХ (ВСЕ 19) =====
        // =====================================================
        const DRAMAS = {
            // ===== ДОРАМА 1: Завтра снова на работу! =====
            drama1: {
                name: 'Завтра снова на работу!',
                episodes: 6,
                storageKey: 'lastDramaEpisode1',
                info: {
                    year: '2024',
                    director: 'Чо Ын-соль',
                    genre: 'мелодрама, комедия',
                    country: 'Республика Корея',
                    duration: '01:10:00',
                    translation: 'Профессиональный многоголосый',
                    plot: 'Увлекательная история о жизни и любви. Кан Си У и Ча Джи Юн — двое совершенно разных людей, чьи судьбы переплетаются в вихре событий. Он — известный архитектор, она — талантливый дизайнер. Смогут ли они преодолеть все преграды на пути к счастью?',
                    cast: [
                        { name: 'Со Ин Гук', role: 'Кан Си У', tag: 'Главная роль' },
                        { name: 'Пак Джи Хён', role: 'Ча Джи Юн', tag: 'Главная роль' },
                        { name: 'Кан Ми На', role: 'Юн Но А', tag: 'Второстепенная роль' },
                        { name: 'Чхве Гён Хун', role: 'Чо Га Ыль', tag: 'Второстепенная роль' },
                        { name: 'Вон Гю Бин', role: 'Ли Чжэ Ин', tag: 'Второстепенная роль' },
                        { name: 'Пак Е Ён', role: 'Чхве Су Джин', tag: 'Второстепенная роль' }
                    ]
                },
                videos: {

ории. Ради любимого и ради справедливости она готова на многое, а рядом с ней — верные друзья, без которых такие бои не выигрывают. Постепенно линии судьбы вновь пересекаются: влюблённые встречаются посреди хаоса войны и вместе идут против общего врага, мечтая только об одном — вернуться домой, туда, где начиналась их история, ещё до всех этих метелей, интриг и крови.',

        function renderComments() {
            const container = document.getElementById('commentsList');
            const countSpan = document.getElementById('commentsCount');

            countSpan.textContent = `(${comments.length})`;

            if (comments.length === 0) {

                    </div>
                `;

            container.innerHTML = html;

            container.querySelectorAll('.comment-delete').forEach(btn => {

                    comments.splice(index, 1);
                    localStorage.setItem(COMMENTS_STORAGE_KEY, JSON.stringify(comments));

                });
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('submitComment').addEventListener('click', function() {

            }

            const now = new Date();
            const date = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

            comments.push({ name, text, date });
            localStorage.setItem(COMMENTS_STORAGE_KEY, JSON.stringify(comments));

            if (nameInput.value.trim() === '') {
