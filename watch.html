<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Смотреть дораму</title>
    <link rel="icon" href="Log.png" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0b0e14;
            --bg-secondary: #151b24;
            --bg-card: #151b24;
            --bg-header: #0f141c;
            --text-primary: #f0f2f5;
            --text-secondary: #8892a8;
            --text-muted: #6a7288;
            --border-color: #1f2631;
            --border-light: #2a313f;
            --shadow: rgba(0, 0, 0, 0.5);
            --shadow-glow: rgba(241, 196, 15, 0.15);
            --input-bg: #000000;
            --toast-bg: #151b24;
            --modal-bg: #151b24;
            --scrollbar-track: #1a212b;
            --scrollbar-thumb: #f1c40f;
            --accent-color: #f1c40f;
            --accent-hover: #f39c12;
        }

        [data-theme="light"] {
            --bg-primary: #e8f4f8;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-header: #d4ecf5;
            --text-primary: #1a2a3a;
            --text-secondary: #3a5a6a;
            --text-muted: #5a7a8a;
            --border-color: #b0d4e0;
            --border-light: #90c4d4;
            --shadow: rgba(0, 180, 200, 0.15);
            --shadow-glow: rgba(0, 212, 255, 0.25);
            --input-bg: #f0f8fa;
            --toast-bg: #ffffff;
            --modal-bg: #ffffff;
            --scrollbar-track: #d4ecf5;
            --scrollbar-thumb: #00bcd4;
            --accent-color: #00bcd4;
            --accent-hover: #0097a7;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .header {
            padding: 16px 30px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            transition: background 0.3s ease, border-color 0.3s ease;
            z-index: 100;
            position: relative;
        }

        .header .back-btn {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            padding: 10px 24px;
            background: #1a4d2e;
            border: 2px solid var(--accent-color);
            border-radius: 30px;
            transition: 0.3s ease;
            display: inline-block;
        }

        .header .back-btn:hover {
            background: #2a6d3e;
            border-color: var(--accent-hover);
            transform: scale(1.02);
            box-shadow: 0 0 30px var(--shadow-glow);
        }

        .header .title {
            font-size: 22px;
            font-weight: 700;
            color: #1a4d2e;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.5), 0 0 20px rgba(241, 196, 15, 0.3), 0 0 40px rgba(241, 196, 15, 0.1);
            -webkit-text-stroke: 1px var(--accent-color);
            text-stroke: 1px var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: text-shadow 0.3s ease, -webkit-text-stroke 0.3s ease;
        }

        .header .title span {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 16px;
            margin-left: 10px;
            transition: color 0.3s ease;
        }

        .theme-toggle-wrapper {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle-label {
            color: var(--text-secondary);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .theme-switch {
            position: relative;
            width: 56px;
            height: 30px;
            background: #2a313f;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s ease;
            border: 2px solid #3a4555;
            flex-shrink: 0;
        }

        [data-theme="light"] .theme-switch {
            background: #00bcd4;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .theme-switch .slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 22px;
            height: 22px;
            background: #8892a8;
            border-radius: 50%;
            transition: 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        [data-theme="light"] .theme-switch .slider {
            left: 28px;
            background: #ffffff;
            box-shadow: 0 2px 12px rgba(0, 212, 255, 0.4);
        }

        .theme-switch:hover {
            border-color: var(--accent-color);
            transform: scale(1.05);
        }

        .theme-switch .theme-icons {
            display: flex;
            justify-content: space-between;
            padding: 0 6px;
            align-items: center;
            height: 100%;
            font-size: 14px;
            color: #6a7288;
            pointer-events: none;
        }

        [data-theme="light"] .theme-icons .sun-icon { color: #ffffff; }
        [data-theme="dark"] .theme-icons .moon-icon { color: #f1c40f; }

        .main-content {
            flex: 1;
            padding: 20px 30px 30px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        /* =====================================================
           ПЛЕЕР
           ===================================================== */
        .player-wrapper {
            width: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
            aspect-ratio: 16 / 9;
            transition: border-color 0.3s ease;
            cursor: default;
        }

        .player-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            pointer-events: auto;
        }

        /* =====================================================
           ОВЕРЛЕЙ (только для полноэкранного режима)
           ===================================================== */
        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: default;
            pointer-events: none;
            background: transparent;
        }

        .player-overlay.active {
            pointer-events: none;
        }

        /* =====================================================
           КНОПКА МЕНЮ СЕРИЙ (только по ней кликаем)
           ===================================================== */
        .episode-menu-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 9999999 !important;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            color: #fff;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            font-family: system-ui, sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
            user-select: none;
            pointer-events: auto !important;
        }

        .episode-menu-btn:hover {
            background: rgba(0, 0, 0, 0.95);
            border-color: var(--accent-color);
            transform: scale(1.05);
        }

        .episode-menu-btn .arrow {
            transition: 0.3s ease;
        }

        .episode-menu-btn .arrow.open {
            transform: rotate(180deg);
        }

        /* ВЫПАДАЮЩЕЕ МЕНЮ СЕРИЙ */
        .episode-dropdown {
            position: absolute;
            top: 54px;
            left: 12px;
            z-index: 99999999 !important;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 10px 12px;
            max-height: 0;
            opacity: 0;
            visibility: hidden;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        opacity 0.3s ease,
                        visibility 0.3s ease;
            min-width: 120px;
            max-width: 260px;
            box-shadow: 0 16px 60px rgba(0, 0, 0, 0.95);
            pointer-events: auto !important;
            overflow-y: auto;
        }

        .episode-dropdown.open {
            max-height: 360px;
            opacity: 1;
            visibility: visible;
        }

        .episode-dropdown::-webkit-scrollbar {
            width: 4px;
        }
        .episode-dropdown::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .episode-dropdown::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 10px;
        }

        .episode-dropdown .episode-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 14px;
            border-radius: 10px;
            color: #ccc;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s ease;
            white-space: nowrap;
            border: none;
            background: transparent;
            width: 100%;
            font-family: system-ui, sans-serif;
        }

        .episode-dropdown .episode-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .episode-dropdown .episode-item.active {
            background: rgba(241, 196, 15, 0.2);
            color: var(--accent-color);
            border: 1px solid rgba(241, 196, 15, 0.3);
        }

        .episode-dropdown .episode-item .num {
            font-weight: 700;
            min-width: 28px;
            color: #888;
        }

        .episode-dropdown .episode-item.active .num {
            color: var(--accent-color);
        }

        .episode-dropdown .episode-item .check {
            margin-left: auto;
            color: var(--accent-color);
            font-size: 16px;
            opacity: 0;
            transition: 0.2s ease;
        }

        .episode-dropdown .episode-item.active .check {
            opacity: 1;
        }

        /* ИНФОРМАЦИЯ О СЕРИИ НА ПЛЕЕРЕ (снизу слева) */
        .player-episode-info {
            position: absolute;
            bottom: 16px;
            left: 16px;
            z-index: 999999;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 500;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            font-family: system-ui, sans-serif;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player-episode-info .ep-num {
            color: var(--accent-color);
            font-weight: 700;
        }

        /* КНОПКА ПОЛНОЭКРАННОГО РЕЖИМА */
        .fs-btn {
            position: absolute;
            bottom: 16px;
            right: 16px;
            z-index: 999999;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            padding: 6px 12px;
            cursor: pointer;
            pointer-events: auto;
            transition: 0.3s ease;
            font-family: system-ui, sans-serif;
            line-height: 1;
        }

        .fs-btn:hover {
            background: rgba(0, 0, 0, 0.8);
            border-color: var(--accent-color);
            transform: scale(1.05);
        }

        /* =====================================================
           ПОЛНОЭКРАННЫЙ РЕЖИМ (position: fixed)
           ===================================================== */
        .player-wrapper.fullscreen-mode {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            border-radius: 0 !important;
            border: none !important;
            z-index: 999999 !important;
            aspect-ratio: auto !important;
            background: #000;
        }

        /* Принудительный альбомный вид на Android */
        .player-wrapper.fullscreen-mode.landscape-force {
            width: 100vw !important;
            height: 100vh !important;
        }

        @media screen and (orientation: portrait) {
            .player-wrapper.fullscreen-mode.landscape-force {
                transform: rotate(90deg) !important;
                transform-origin: center center !important;
                width: 100vh !important;
                height: 100vw !important;
                top: 50% !important;
                left: 50% !important;
                transform: translate(-50%, -50%) rotate(90deg) !important;
            }
        }

        .player-wrapper.fullscreen-mode .episode-menu-btn {
            top: 20px;
            left: 20px;
            font-size: 18px;
            padding: 12px 24px;
            z-index: 99999999 !important;
        }

        .player-wrapper.fullscreen-mode .episode-dropdown {
            top: 68px;
            left: 20px;
            z-index: 99999999 !important;
            min-width: 180px;
            max-width: 320px;
            font-size: 16px;
        }

        .player-wrapper.fullscreen-mode .episode-dropdown .episode-item {
            font-size: 16px;
            padding: 10px 16px;
        }

        .player-wrapper.fullscreen-mode .player-episode-info {
            font-size: 16px;
            bottom: 30px;
            left: 30px;
            padding: 6px 18px;
        }

        .player-wrapper.fullscreen-mode .fs-btn {
            bottom: 30px;
            right: 30px;
            font-size: 24px;
            padding: 8px 16px;
        }

        .player-wrapper.fullscreen-mode .player-overlay {
            pointer-events: none;
        }

        /* =====================================================
           ВЫБОР СЕРИЙ ПОД ПЛЕЕРОМ
           ===================================================== */
        .episode-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .episode-info .current-episode {
            font-size: 20px;
            font-weight: 600;
            color: var(--accent-color);
            transition: color 0.3s ease;
        }

        .episode-info .episode-title {
            color: var(--text-secondary);
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .episodes-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0 14px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }

        .episodes-selector .label {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            transition: color 0.3s ease;
        }

        .episodes-scroll {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
            max-height: 60px;
            overflow-y: auto;
            padding: 4px 2px;
            scroll-behavior: smooth;
        }

        .episodes-scroll::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .episodes-scroll::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 10px;
        }
        .episodes-scroll::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 10px;
        }

        .episode-btn {
            background: var(--bg-secondary);
            border: 2px solid var(--border-light);
            color: var(--text-secondary);
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.25s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .episode-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
            transform: scale(1.05);
        }

        .episode-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #0b0e14;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.3);
        }

        .episode-btn.active:hover {
            transform: scale(1.02);
        }

        .episode-nav-buttons {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .episode-nav-btn {
            background: var(--bg-secondary);
            border: 2px solid var(--border-light);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.25s ease;
        }

        .episode-nav-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
            transform: scale(1.05);
        }

        .episode-nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .episode-nav-btn:disabled:hover {
            border-color: var(--border-light);
            color: var(--text-secondary);
            transform: none;
        }

        /* =====================================================
           ИНФОРМАЦИЯ О ДОРАМЕ
           ===================================================== */
        .drama-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 10px;
        }

        .drama-description {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.8;
            transition: color 0.3s ease;
        }

        .drama-description .info-item {
            display: flex;
            gap: 10px;
            margin-bottom: 6px;
        }

        .drama-description .info-item .label {
            color: var(--text-muted);
            min-width: 120px;
            flex-shrink: 0;
            transition: color 0.3s ease;
        }

        .drama-description .info-item .value {
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .drama-description .plot {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.8;
            margin-top: 8px;
            transition: color 0.3s ease;
        }

        .drama-description .plot strong {
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .cast-section .cast-title {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            transition: color 0.3s ease;
        }

        .cast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .cast-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .cast-item .actor-name {
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .cast-item .actor-role {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 2px;
            transition: color 0.3s ease;
        }

        .cast-item .actor-role-tag {
            background: #1e232c;
            color: var(--accent-color);
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 4px;
            transition: color 0.3s ease;
        }

        /* =====================================================
           КОММЕНТАРИИ
           ===================================================== */
        .comments-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            width: 100%;
            transition: border-color 0.3s ease;
        }

        .comments-section .comments-title {
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color 0.3s ease;
        }

        .comments-section .comments-title span {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        .comment-form {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .comment-form input {
            flex: 1;
            min-width: 200px;
            padding: 12px 18px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-light);
            border-radius: 30px;
            color: var(--text-primary);
            font-family: system-ui, sans-serif;
            font-size: 14px;
            outline: none;
            transition: 0.3s ease;
        }

        .comment-form input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 30px var(--shadow-glow);
        }

        .comment-form input::placeholder {
            color: var(--text-muted);
        }

        .comment-form textarea {
            flex: 2;
            min-width: 300px;
            padding: 12px 18px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-light);
            border-radius: 16px;
            color: var(--text-primary);
            font-family: system-ui, sans-serif;
            font-size: 14px;
            outline: none;
            resize: vertical;
            min-height: 60px;
            transition: 0.3s ease;
        }

        .comment-form textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 30px var(--shadow-glow);
        }

        .comment-form .submit-btn {
            background: #1a4d2e;
            border: 2px solid var(--accent-color);
            border-radius: 30px;
            color: var(--text-primary);
            padding: 12px 28px;
            font-family: system-ui, sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            white-space: nowrap;
        }

        .comment-form .submit-btn:hover {
            background: #2a6d3e;
            border-color: var(--accent-hover);
            transform: scale(1.02);
            box-shadow: 0 0 30px var(--shadow-glow);
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .comments-list::-webkit-scrollbar {
            width: 4px;
        }
        .comments-list::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 10px;
        }
        .comments-list::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 10px;
        }

        .comment-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 18px;
            animation: fadeInUp 0.3s ease;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

            toast.innerHTML = `<span class="toast-icon">${icon}</span> ${message}`;

            setTimeout(() => {

                    <div class="info-item"><span class="label"> Год выпуска:</span><span class="value">${info.year}</span></div>
                    <div class="info-item"><span class="label"> Режиссёр:</span><span class="value">${info.director}</span></div>
                    <div class="info-item"><span class="label"> Жанр:</span><span class="value">${info.genre}</span></div>
                    <div class="info-item"><span class="label"> Страна:</span><span class="value">${info.country}</span></div>
                    ${info.duration ? `<div class="info-item"><span class="label"> Продолжительность:</span><span class="value">${info.duration}</span></div>` : ''}
                    ${info.translation ? `<div class="info-item"><span class="label"> Перевод:</span><span class="value">${info.translation}</span></div>` : ''}
                    ${info.plot ? `<div class="plot"><strong>Описание:</strong><br>${info.plot}</div>` : ''}
                </div>
                <div class="cast-section">
                    <div class="cast-title"> Актёрский состав</div>
                    <div class="cast-grid">${castHtml}</div>
                </div>
            `;
        }

        function renderEpisodes() {
            episodesScroll.innerHTML = '';
            for (let i = 1; i <= drama.episodes; i++) {
                const btn = document.createElement('button');
                btn.className = 'episode-btn' + (i === currentEpisode ? ' active' : '');
                btn.textContent = i;
                btn.dataset.number = i;
                btn.addEventListener('click', () => loadEpisode(i));
                episodesScroll.appendChild(btn);
            }
            updateNavButtons();
        }

        function renderDropdown() {
            episodeDropdown.innerHTML = '';
            for (let i = 1; i <= drama.episodes; i++) {
                const item = document.createElement('button');
                item.className = 'episode-item' + (i === currentEpisode ? ' active' : '');
                item.innerHTML = `
                    <span class="num">${i}</span>
                    <span>Серия ${i}</span>
                    <span class="check">✓</span>
                `;
                item.dataset.number = i;
                item.addEventListener('click', () => {
                    loadEpisode(i);
                    closeDropdown();
                });
                episodeDropdown.appendChild(item);
            }
        }

        function toggleDropdown() {
            isDropdownOpen = !isDropdownOpen;
            episodeDropdown.classList.toggle('open', isDropdownOpen);
            menuArrow.classList.toggle('open', isDropdownOpen);
        }

        function closeDropdown() {
            isDropdownOpen = false;
            episodeDropdown.classList.remove('open');
            menuArrow.classList.remove('open');
        }

        function loadEpisode(number) {
            currentEpisode = number;
            const episode = episodes.find(e => e.number === number);
            currentEpisodeSpan.textContent = `Серия ${number}`;
            episodeTitleSpan.textContent = `— ${episode ? episode.title : ''}`;
            menuCurrentEpisode.textContent = `Серия ${number}`;
            playerEpNum.textContent = `Серия ${number}`;

            document.querySelectorAll('.episode-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.number) === number);
            });

            document.querySelectorAll('.episode-item').forEach(item => {
                item.classList.toggle('active', parseInt(item.dataset.number) === number);
            });

            const videoUrl = drama.videos[number];
            if (videoUrl) {
                videoPlayer.src = videoUrl;
            }

            saveLastEpisode(number);
            updateNavButtons();
            scrollToActiveEpisode();
        }

        function scrollToActiveEpisode() {
            const activeBtn = episodesScroll.querySelector('.episode-btn.active');
            if (activeBtn) {
                activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        function updateNavButtons() {
            const prevBtn = document.getElementById('prevEpisodeBtn');
            const nextBtn = document.getElementById('nextEpisodeBtn');
            prevBtn.disabled = currentEpisode <= 1;
            nextBtn.disabled = currentEpisode >= drama.episodes;
        }

        function saveLastEpisode(number) {
            try { localStorage.setItem(drama.storageKey, number); } catch(e) {}
        }

        function getLastEpisode() {
            try { return parseInt(localStorage.getItem(drama.storageKey)) || 1; } catch(e) { return 1; }
        }

        // =====================================================
        // ===== ПОЛНОЭКРАННЫЙ РЕЖИМ =====
        // =====================================================
        function toggleFullscreen() {
            isFullscreen = !isFullscreen;
            if (isFullscreen) {
                playerWrapper.classList.add('fullscreen-mode');
                // Принудительный альбомный вид на Android
                if (/android/i.test(navigator.userAgent)) {
                    playerWrapper.classList.add('landscape-force');
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock('landscape').catch(() => {});
                    }
                }
                fsBtn.textContent = '✕';
                fsBtn.title = 'Выйти из полноэкранного режима';
                document.body.style.overflow = 'hidden';
                playerOverlay.classList.add('active');
            } else {
                playerWrapper.classList.remove('fullscreen-mode');
                playerWrapper.classList.remove('landscape-force');
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
                fsBtn.textContent = '⛶';
                fsBtn.title = 'На весь экран';
                document.body.style.overflow = 'auto';
                playerOverlay.classList.remove('active');
                closeDropdown();
            }
        }

        fsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFullscreen();
        });

        // Двойной клик по плееру
        playerWrapper.addEventListener('dblclick', (e) => {
            if (e.target.closest('button')) return;
            toggleFullscreen();
        });

        // Клавиша Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isFullscreen) {
                toggleFullscreen();
            }
        });

        // =====================================================
        // ===== ОБРАБОТЧИКИ =====
        // =====================================================

        // ТОЛЬКО КНОПКА МЕНЮ ОТКРЫВАЕТ МЕНЮ
        episodeMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDropdown();
        });

        // Закрываем меню при клике вне плеера
        document.addEventListener('click', (e) => {
            if (!playerWrapper.contains(e.target)) {
                closeDropdown();
            }
        });

        // Клавиши навигации
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowLeft' && currentEpisode > 1) loadEpisode(currentEpisode - 1);
            if (e.key === 'ArrowRight' && currentEpisode < drama.episodes) loadEpisode(currentEpisode + 1);
        });

        document.getElementById('prevEpisodeBtn').addEventListener('click', () => {
            if (currentEpisode > 1) loadEpisode(currentEpisode - 1);
        });

        document.getElementById('nextEpisodeBtn').addEventListener('click', () => {
            if (currentEpisode < drama.episodes) loadEpisode(currentEpisode + 1);
        });

        // =====================================================
        // ===== ИНИЦИАЛИЗАЦИЯ =====
        // =====================================================
        renderInfo();
        renderEpisodes();
        renderDropdown();
        loadEpisode(getLastEpisode());

        // =====================================================
        // ===== КОММЕНТАРИИ =====
        // =====================================================
        const COMMENTS_STORAGE_KEY = `comments_${dramaId}`;
        let comments = JSON.parse(localStorage.getItem(COMMENTS_STORAGE_KEY)) || [];

        function renderComments() {
            const container = document.getElementById('commentsList');
            const countSpan = document.getElementById('commentsCount');

            countSpan.textContent = `(${comments.length})`;

            if (comments.length === 0) {
                container.innerHTML = '<div class="no-comments">Пока нет комментариев. Будьте первым! </div>';
                return;
            }

            let html = '';
            comments.forEach((comment, index) => {
                html += `
                    <div class="comment-item">
                        <div class="comment-header">
                            <span class="comment-author">${escapeHtml(comment.name)}</span>
                            <div>
                                <span class="comment-date">${comment.date}</span>
                                <button class="comment-delete" data-index="${index}">✕</button>
                            </div>
                        </div>
                        <div class="comment-text">${escapeHtml(comment.text)}</div>
                    </div>
                `;
            });
            container.innerHTML = html;

            container.querySelectorAll('.comment-delete').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = parseInt(this.dataset.index);
                    comments.splice(index, 1);
                    localStorage.setItem(COMMENTS_STORAGE_KEY, JSON.stringify(comments));
                    renderComments();
                });
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('submitComment').addEventListener('click', function() {
            const nameInput = document.getElementById('commentName');
            const textInput = document.getElementById('commentText');
            const name = nameInput.value.trim() || 'Аноним';
            const text = textInput.value.trim();

            if (!text) {
                showToast('Напишите комментарий!', '⚠️', 'error');
                return;
            }

            const now = new Date();
            const date = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

            comments.push({ name, text, date });
            localStorage.setItem(COMMENTS_STORAGE_KEY, JSON.stringify(comments));

            textInput.value = '';
            if (nameInput.value.trim() === '') {
                nameInput.value = '';
            }

            renderComments();
            textInput.focus();
            showToast('Комментарий добавлен!', '✅', 'success');
        });

        document.getElementById('commentText').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                document.getElementById('submitComment').click();
            }
        });

        renderComments();
    </script>
</body>
</html>
